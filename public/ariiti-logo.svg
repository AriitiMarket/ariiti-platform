<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050916" />
      <stop offset="50%" stop-color="#0A132C" />
      <stop offset="100%" stop-color="#040813" />
    </linearGradient>

    <!-- Logo Monogram Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <linearGradient id="accent-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="core-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#00D2FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0" />
    </radialGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="500" height="500" rx="100" fill="url(#logo-bg)" />
  <circle cx="250" cy="225" r="180" fill="url(#core-glow)" />

  <!-- Subtle Outer Border -->
  <rect x="2" y="2" width="496" height="496" rx="98" fill="none" stroke="#162E56" stroke-width="3" />

  <!-- Geometric Modern Monogram Emblem "A" & Tech Node -->
  <g transform="translate(250, 205)">
    <!-- Left Angled Pillar -->
    <path d="M 0 -130 L -95 70 L -45 70 L 0 -30 Z" fill="url(#accent-cyan)" filter="url(#neon-glow)" />

    <!-- Right Angled Pillar -->
    <path d="M 0 -130 L 95 70 L 45 70 L 0 -30 Z" fill="url(#accent-indigo)" filter="url(#neon-glow)" />

    <!-- Intersecting Crossbar -->
    <path d="M -60 15 L 60 15 L 50 45 L -50 45 Z" fill="#FFFFFF" opacity="0.95" />

    <!-- Central Floating Connectivity Node -->
    <circle cx="0" cy="30" r="14" fill="#050916" stroke="#00D2FF" stroke-width="4" />
    <circle cx="0" cy="30" r="6" fill="#00D2FF" />

    <!-- Satellite Nodes -->
    <circle cx="0" cy="-130" r="7" fill="#00D2FF" filter="url(#neon-glow)" />
    <circle cx="-95" cy="70" r="7" fill="#0066FF" />
    <circle cx="95" cy="70" r="7" fill="#6366F1" />

    <!-- Connecting Circuit Vectors -->
    <line x1="0" y1="-130" x2="-95" y2="70" stroke="#00D2FF" stroke-width="2" opacity="0.4" />
    <line x1="0" y1="-130" x2="95" y2="70" stroke="#38BDF8" stroke-width="2" opacity="0.4" />
    <line x1="-95" y1="70" x2="95" y2="70" stroke="#6366F1" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Brand Typography -->
  <g text-anchor="middle" transform="translate(250, 360)">
    <!-- Company Name -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="6" fill="#FFFFFF">ARIITI TECH</text>
    
    <!-- Subtitle Definition -->
    <text y="32" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" letter-spacing="3" fill="#00D2FF">TECHNOLOGIES &amp; DIGITAL SOLUTIONS</text>
    
    <!-- Scope Highlights -->
    <text y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" letter-spacing="1.5" fill="#94A3B8">SOFTWARE • MOBILE • DIGITAL COMMERCE</text>
  </g>
</svg>
